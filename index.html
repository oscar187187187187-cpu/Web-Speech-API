<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hablamos - KI Coach</title>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- DESIGN (iPhone Optimized) --- */
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent-color: #66fcf1;
            --accent-dark: #45a29e;
            --green: #2ecc71;
            --yellow: #f1c40f;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- HEADER --- */
        .top-bar {
            padding: 20px;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 10px; }
        .streak-fire { color: #e74c3c; }
        .settings-btn { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; transition: 0.2s; }

        /* --- COLLAPSIBLE MENUS --- */
        .control-panel {
            background-color: var(--bg-color);
            z-index: 90;
            overflow-y: auto;
            max-height: 40vh;
        }

        .accordion {
            background-color: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            text-align: left;
            border: none;
            border-bottom: 1px solid #333;
            outline: none;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accordion:after {
            content: '\f078';
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .accordion.active:after { transform: rotate(180deg); }

        .panel {
            padding: 0 20px;
            background-color: #11151c;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .panel-content { padding: 15px 0; display: flex; flex-direction: column; gap: 15px; }

        select, .panel-content textarea {
            width: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .panel-content textarea { height: 80px; resize: none; }

        .btn-primary {
            background-color: var(--accent-dark);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .history-list { list-style: none; }
        .history-list li {
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-list button { background: none; border: none; color: var(--accent-color); font-size: 1.2rem; cursor: pointer; }

        /* --- CHAT AREA --- */
        .chat-window {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 110px;
        }

        .message-container { display: flex; flex-direction: column; max-width: 85%; }
        .msg-user-wrapper { align-self: flex-end; align-items: flex-end; }
        .msg-ai-wrapper { align-self: flex-start; align-items: flex-start; }

        .message-bubble {
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 1.05rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .msg-user { background-color: var(--accent-dark); color: #fff; border-bottom-right-radius: 4px; }
        .msg-ai { background-color: var(--card-bg); border: 1px solid #333; border-bottom-left-radius: 4px; }

        /* 3-Stufen-Lehrer-Feedback */
        .feedback-box {
            margin-top: 5px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            max-width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .feedback-green { background-color: rgba(46, 204, 113, 0.15); border: 1px solid var(--green); color: var(--green); }
        .feedback-yellow { background-color: rgba(241, 196, 15, 0.15); border: 1px solid var(--yellow); color: var(--yellow); }
        .feedback-red { background-color: rgba(231, 76, 60, 0.15); border: 1px solid var(--red); color: var(--red); }

        /* --- INPUT BAR (SCHREIBEN & MIKROFON GEMINI-STYLE) --- */
        .input-bar-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid #333;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid #444;
            border-radius: 25px;
            padding: 5px 8px 5px 16px;
            gap: 10px;
        }

        .text-input {
            flex-grow: 1;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            padding: 8px 0;
        }

        .send-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn-inline {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .mic-btn-inline:active { transform: scale(0.95); }
        .mic-btn-inline.recording {
            background-color: var(--red);
            color: white;
            box-shadow: 0 0 15px var(--red);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* --- MODAL (API TRESOR) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 12, 16, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #444;
            text-align: center;
        }
        .modal-content h3 { color: var(--accent-color); margin-bottom: 15px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 20px; background-color: var(--bg-color); border: 1px solid #555; color: white; border-radius: 8px;}
        .loading-text { color: var(--accent-color); font-size: 0.85rem; font-weight: bold; text-align: center; display: none; }
        
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-fire streak-fire"></i> <span id="streakCounter">0</span> | Hablamos
        </div>
        <button class="settings-btn" onclick="openVault()"><i class="fas fa-cog"></i></button>
    </div>

    <!-- Akkordeon Menüs -->
    <div class="control-panel">
        <button class="accordion"><i class="fas fa-book-open"></i> Training Setup</button>
        <div class="panel">
            <div class="panel-content">
                <select id="diffSelect">
                    <option value="leicht">🟢 Leicht (Kurz & Simpel)</option>
                    <option value="mittel" selected>🟡 Mittel (Normaler Flow)</option>
                    <option value="schwer">🔴 Schwer (Komplex)</option>
                </select>
                <textarea id="vocabInput" placeholder="Spanische Wörter hier eingeben (Komma getrennt)..."></textarea>
                <button class="btn-primary" onclick="startNewCall()">Neuen Call starten</button>
            </div>
        </div>

        <button class="accordion"><i class="fas fa-history"></i> Chat Archiv</button>
        <div class="panel">
            <div class="panel-content">
                <ul class="history-list" id="historyList">
                    <!-- Alte Chats laden hier -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Chat Bereich -->
    <div class="chat-window" id="chatWindow">
        <div style="text-align:center; color:#777; margin-top:20px;">Wähle oben dein Setup und starte das Gespräch!</div>
    </div>

    <!-- EINGABELEISTE (Schreiben + Mikrofon) -->
    <div class="input-bar-container">
        <div class="loading-text" id="loadingText">Verarbeite Audio...</div>
        <div class="input-wrapper">
            <input type="text" id="textInput" class="text-input" placeholder="Schreibe auf Spanisch..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendTextMessage()" title="Senden">
                <i class="fas fa-paper-plane"></i>
            </button>
            <button class="mic-btn-inline" id="micBtn" onclick="toggleRecording()" title="Einsprechen">
                <i class="fas fa-microphone"></i>
            </button>
        </div>
    </div>

    <!-- API Tresor -->
    <div class="modal" id="vaultModal">
        <div class="modal-content">
            <h3><i class="fas fa-lock"></i> API Tresor</h3>
            <p style="margin-bottom: 15px; font-size: 0.85rem; color:#aaa;">Dein Groq Key bleibt nur auf diesem Gerät.</p>
            <input type="password" id="keyInput" placeholder="gsk_...">
            <button class="btn-primary" onclick="saveKey()">Speichern</button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIK -->
    <script>
        // DOM Elements
        const chatWindow = document.getElementById('chatWindow');
        const vocabInput = document.getElementById('vocabInput');
        const diffSelect = document.getElementById('diffSelect');
        const textInput = document.getElementById('textInput');
        const micBtn = document.getElementById('micBtn');
        const loadingText = document.getElementById('loadingText');
        const vaultModal = document.getElementById('vaultModal');
        const streakCounter = document.getElementById('streakCounter');
        
        // State
        let currentMessages = [];
        let pastChats = JSON.parse(localStorage.getItem('hablamos_chats')) || [];
        let synth = window.speechSynthesis;
        
        // Audio Recording State
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        // Akkordeon Logik
        var acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        }

        // Init
        window.onload = () => {
            vocabInput.value = localStorage.getItem('hablamos_vocab') || '';
            vocabInput.addEventListener('input', () => localStorage.setItem('hablamos_vocab', vocabInput.value));
            diffSelect.value = localStorage.getItem('hablamos_diff') || 'mittel';
            diffSelect.addEventListener('change', () => localStorage.setItem('hablamos_diff', diffSelect.value));
            
            updateStreak();
            renderHistory();
        };

        // Streak System
        function updateStreak() {
            let lastDate = localStorage.getItem('hablamos_last_date');
            let streak = parseInt(localStorage.getItem('hablamos_streak') || '0');
            let today = new Date().toDateString();
            
            if (lastDate !== today) {
                if (lastDate === new Date(Date.now() - 86400000).toDateString()) {
                    streak++; 
                } else if (lastDate) {
                    streak = 1; 
                } else {
                    streak = 1;
                }
                localStorage.setItem('hablamos_last_date', today);
                localStorage.setItem('hablamos_streak', streak);
            }
            streakCounter.innerText = streak;
        }

        // Vault Logic
        function openVault() {
            document.getElementById('keyInput').value = localStorage.getItem('hablamos_groq_key') || '';
            vaultModal.style.display = 'flex';
        }
        function saveKey() {
            localStorage.setItem('hablamos_groq_key', document.getElementById('keyInput').value.trim());
            vaultModal.style.display = 'none';
        }

        // Chat Management
        function startNewCall() {
            if(currentMessages.length > 2) saveCurrentChat();
            currentMessages = [];
            chatWindow.innerHTML = '';
            for (let i = 0; i < acc.length; i++) {
                acc[i].classList.remove("active");
                acc[i].nextElementSibling.style.maxHeight = null;
            }
            triggerAIStart();
        }

        function saveCurrentChat() {
            if(currentMessages.length < 3) return;
            const title = new Date().toLocaleString([], {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
            pastChats.unshift({ title: title, messages: currentMessages });
            localStorage.setItem('hablamos_chats', JSON.stringify(pastChats));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            pastChats.forEach((chat, index) => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${chat.title}</span> <button onclick="resumeChat(${index})"><i class="fas fa-play-circle"></i></button>`;
                list.appendChild(li);
            });
        }

        function resumeChat(index) {
            currentMessages = pastChats[index].messages;
            pastChats.splice(index, 1);
            localStorage.setItem('hablamos_chats', JSON.stringify(pastChats));
            renderHistory();
            rebuildChatUI();
            
            for (let i = 0; i < acc.length; i++) {
                acc[i].classList.remove("active");
                acc[i].nextElementSibling.style.maxHeight = null;
            }
        }

        function rebuildChatUI() {
            chatWindow.innerHTML = '';
            currentMessages.forEach(msg => {
                if(msg.role === 'user') appendUserHTML(msg.content, msg.feedback);
                if(msg.role === 'assistant') appendAIHTML(msg.content);
            });
        }

        // --- SCHREIB-FUNKTION ---
        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendTextMessage();
            }
        }

        function sendTextMessage() {
            const text = textInput.value.trim();
            if(!text) return;
            
            textInput.value = '';
            processUserInput(text);
        }

        // --- MICROPHONE & WHISPER API ---
        async function toggleRecording() {
            const key = localStorage.getItem('hablamos_groq_key');
            if(!key) { openVault(); return alert("Bitte trage zuerst deinen Groq-Key im Tresor ein."); }

            if (isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = sendAudioToWhisper;
                    
                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add('recording');
                    
                    // iOS Audio-Engine priming
                    if(synth.speaking) synth.cancel();
                    let prime = new SpeechSynthesisUtterance("");
                    synth.speak(prime);

                } catch(err) {
                    alert("Mikrofon-Zugriff verweigert! Bitte in den Safari/Chrome-Einstellungen erlauben.");
                }
            }
        }

        async function sendAudioToWhisper() {
            loadingText.innerText = "Transkribiere Spanisch...";
            loadingText.style.display = 'block';
            
            const key = localStorage.getItem('hablamos_groq_key');
            
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
            const file = new File([audioBlob], "aufnahme.webm", { type: audioBlob.type });

            const formData = new FormData();
            formData.append("file", file);
            formData.append("model", "whisper-large-v3-turbo");
            formData.append("language", "es");

            try {
                const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}` },
                    body: formData
                });
                
                if(!res.ok) throw new Error("API Limit oder falscher Key");
                
                const data = await res.json();
                if(data.text && data.text.trim().length > 0) {
                    processUserInput(data.text);
                } else {
                    loadingText.style.display = 'none';
                }
            } catch (err) {
                alert("Whisper-Fehler: " + err.message);
                loadingText.style.display = 'none';
            }
        }

        // --- GROQ AI LOGIC (Syntaktisch + semantisch tolerantere Bewertung) ---
        async function processUserInput(text) {
            loadingText.innerText = "Lehrer analysiert...";
            loadingText.style.display = 'block';
            appendUserHTML(text, null); 

            const key = localStorage.getItem('hablamos_groq_key');
            const vocab = vocabInput.value.trim() || 'hola, sí, no';
            const diff = diffSelect.value;
            
            const sysPrompt = `
Du bist ein wohlwollender Spanisch-Lehrer. Schwierigkeit: ${diff}.
ERLAUBTE VOKABELN / FOKUS: ${vocab}.
EVALUATIONSRICHTLINIEN:
- Bewertungsstatus: 
  * "green": Wenn der Satz grammatikalisch korrekt ist und im Kontext Sinn macht. Auch wenn der User ein Synonym verwendet oder ein verständliches Wort wählt, das vielleicht nicht das perfekte Schulbuchwort ist, akzeptiere es zwingend als "green" (richtig)! Du darfst im Feedback-Text sanft auf noch gebräuchlichere Wörter hinweisen.
  * "yellow": Kleine Grammatikfehler oder Schreibfehler, der Satz bleibt aber verständlich.
  * "red": Völlig unverständlich oder schwerer Grammatikfehler.
- DAS FEEDBACK MUSS AUF DEUTSCH SEIN.
- ANTI-ECHO: Wiederhole niemals einfach den Satz des Users. Du MUSST zwingend EINE neue inhaltliche Frage auf Spanisch stellen.

GIB DEINE ANTWORT ZWINGEND IM FOLGENDEN JSON FORMAT ZURÜCK:
{
  "feedback": {
    "status": "green",
    "text": "Kurzes deutsches Feedback zur Grammatik/Wortwahl des Users."
  },
  "reply": "Spanische Antwort und neue Frage."
}`;

            let apiMessages = [{role: "system", content: sysPrompt}];
            currentMessages.slice(-4).forEach(m => apiMessages.push({role: m.role, content: m.content}));
            apiMessages.push({role: "user", content: text});

            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: apiMessages,
                        response_format: { type: "json_object" },
                        temperature: 0.3
                    })
                });
                
                if(!res.ok) throw new Error("API Limit oder falscher Key");
                
                const data = await res.json();
                const jsonRes = JSON.parse(data.choices[0].message.content);
                
                chatWindow.lastChild.remove(); 
                appendUserHTML(text, jsonRes.feedback);
                appendAIHTML(jsonRes.reply);
                
                currentMessages.push({role: 'user', content: text, feedback: jsonRes.feedback});
                currentMessages.push({role: 'assistant', content: jsonRes.reply});
                
                speakText(jsonRes.reply);
                updateStreak();

            } catch (err) {
                appendAIHTML("⚠️ Error: " + err.message);
            } finally {
                loadingText.style.display = 'none';
            }
        }

        async function triggerAIStart() {
            loadingText.innerText = "Startet...";
            loadingText.style.display = 'block';
            const key = localStorage.getItem('hablamos_groq_key');
            const vocab = vocabInput.value.trim();
            const words = vocab.split(',').map(w => w.trim()).filter(w => w);
            const randomWord = words.length > 0 ? words[Math.floor(Math.random() * words.length)] : 'hola';
            
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify({
                        model: 'model: 'llama-3.3-70b-versatile',
                        messages: [
                            {role: "system", content: `Stelle exakt EINE einfache Frage auf Spanisch, die das Wort '${randomWord}' beinhaltet. Nur Spanisch, kein JSON hier.`}
                        ],
                        temperature: 0.5,
                        max_tokens: 50
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                appendAIHTML(reply);
                currentMessages.push({role: 'assistant', content: reply});
                speakText(reply);
            } catch(e) {
                appendAIHTML("⚠️ Bitte API Key überprüfen.");
            } finally {
                loadingText.style.display = 'none';
            }
        }

        // --- HTML BUILDER & TTS ---
        function appendUserHTML(text, fb) {
            const wrap = document.createElement('div');
            wrap.className = 'message-container msg-user-wrapper';
            let html = `<div class="message-bubble msg-user">${text}</div>`;
            
            if(fb) {
                let colorClass = fb.status === 'green' ? 'feedback-green' : (fb.status === 'yellow' ? 'feedback-yellow' : 'feedback-red');
                let icon = fb.status === 'green' ? 'check-circle' : (fb.status === 'yellow' ? 'exclamation-triangle' : 'times-circle');
                html += `<div class="feedback-box ${colorClass}"><i class="fas fa-${icon}"></i> <span>${fb.text}</span></div>`;
            }
            
            wrap.innerHTML = html;
            chatWindow.appendChild(wrap);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendAIHTML(text) {
            const wrap = document.createElement('div');
            wrap.className = 'message-container msg-ai-wrapper';
            wrap.innerHTML = `<div class="message-bubble msg-ai">${text}</div>`;
            chatWindow.appendChild(wrap);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function speakText(text) {
            if(synth.speaking) synth.cancel();
            let utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'es-ES';
            utter.rate = 0.95;
            synth.speak(utter);
        }
    </script>
</body>
</html>
