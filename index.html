<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spanisch Video-Call</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --text-main: #c5c6c7;
            --accent: #66fcf1;
            --accent-hover: #45a29e;
            --success: #4CAF50;
            --warning: #FFC107;
            --danger: #F44336;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 100px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--card-bg);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent);
        }

        .settings-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent);
        }

        textarea, select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid #333;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--accent);
            color: var(--bg-color);
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .msg-user {
            align-self: flex-end;
            background-color: #2c3e50;
            padding: 12px;
            border-radius: 12px 12px 0 12px;
            max-width: 85%;
        }

        .msg-ai {
            align-self: flex-start;
            background-color: #1f2833;
            padding: 12px;
            border-radius: 12px 12px 12px 0;
            max-width: 85%;
            border-left: 4px solid var(--accent);
        }

        .feedback-box {
            margin-top: 8px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #fff;
        }

        .feedback-perfect { background-color: rgba(76, 175, 80, 0.2); border: 1px solid var(--success); }
        .feedback-warning { background-color: rgba(255, 193, 7, 0.2); border: 1px solid var(--warning); }
        .feedback-error { background-color: rgba(244, 67, 54, 0.2); border: 1px solid var(--danger); }

        .mic-btn-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
        }

        .mic-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--danger);
            color: white;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .mic-btn.listening {
            animation: pulse 1.5s infinite;
            background-color: var(--warning);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 193, 7, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-padding: 20px;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }

        .loader {
            text-align: center;
            color: var(--accent);
            margin: 10px 0;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>🇪🇸 Spanisch Call</h1>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </header>

    <div class="card" id="setup-card">
        <label>Dein Sprachniveau:</label>
        <select id="difficulty">
            <option value="🟢 Leicht">🟢 Leicht</option>
            <option value="🟡 Mittel" selected>🟡 Mittel</option>
            <option value="🔴 Schwer">🔴 Schwer</option>
        </select>

        <label>Deine Vokabeln (kommagetrennt):</label>
        <textarea id="vocab-input" rows="4" placeholder="hola, yo, soy, perro, gato..."></textarea>

        <button onclick="startCall()">📞 Call Starten</button>
    </div>

    <div class="loader" id="loader">KI denkt nach... 🧠</div>

    <div class="chat-container" id="chat-container"></div>

    <div class="mic-btn-container" id="mic-container" style="display: none;">
        <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>

    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h2 style="color: var(--accent); margin-bottom: 15px;">Tresor</h2>
            <label>Groq API-Key:</label>
            <input type="password" id="api-key-input" placeholder="gsk_...">
            <button onclick="saveSettings()" style="margin-bottom: 10px;">💾 Speichern</button>
            <button onclick="closeSettings()" style="background-color: #333; color: white;">Abbrechen</button>
        </div>
    </div>

    <script>
        let chatHistory = [];
        let recognition;
        let isListening = false;

        // --- INIT & LOCALSTORAGE ---
        window.onload = () => {
            const savedKey = localStorage.getItem('groqKey');
            const savedVocab = localStorage.getItem('vocab');
            const savedDiff = localStorage.getItem('difficulty');
            const savedChat = localStorage.getItem('chatHistory');

            if(savedKey) document.getElementById('api-key-input').value = savedKey;
            if(savedVocab) document.getElementById('vocab-input').value = savedVocab;
            if(savedDiff) document.getElementById('difficulty').value = savedDiff;

            if(savedChat) {
                chatHistory = JSON.parse(savedChat);
                if(chatHistory.length > 0) {
                    document.getElementById('setup-card').style.display = 'none';
                    document.getElementById('mic-container').style.display = 'block';
                    renderChat();
                }
            }

            setupSpeechRecognition();
        };

        // --- SETTINGS ---
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        function saveSettings() {
            const key = document.getElementById('api-key-input').value;
            localStorage.setItem('groqKey', key);
            closeSettings();
            alert("Key sicher im Browser gespeichert!");
        }

        // --- SPEECH RECOGNITION (Web Speech API) ---
        function setupSpeechRecognition() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                alert("Dein Browser unterstützt die Spracheingabe nicht. Bitte nutze Chrome oder Safari!");
                return;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('mic-btn').classList.add('listening');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                handleUserMessage(transcript);
            };

            recognition.onerror = (event) => {
                alert("Spracherkennung fehlgeschlagen: " + event.error);
                stopMic();
            };

            recognition.onend = () => {
                stopMic();
            };
        }

        function toggleMic() {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopMic() {
            isListening = false;
            document.getElementById('mic-btn').classList.remove('listening');
        }

        // --- TEXT TO SPEECH ---
        function speakSpanish(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'es-ES';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // --- LOGIC ---
        async function startCall() {
            const vocab = document.getElementById('vocab-input').value;
            const diff = document.getElementById('difficulty').value;
            
            localStorage.setItem('vocab', vocab);
            localStorage.setItem('difficulty', diff);

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('mic-container').style.display = 'block';

            // Start Message
            handleUserMessage("Start", true);
        }

        async function handleUserMessage(text, isStart = false) {
            const key = localStorage.getItem('groqKey');
            if (!key) {
                alert("Bitte hinterlege zuerst deinen Groq API-Key im Zahnrad-Menü!");
                return;
            }

            document.getElementById('loader').style.display = 'block';

            if (!isStart) {
                // Zeige User-Text sofort, bevor KI antwortet
                chatHistory.push({ role: "user", content: text, eval: null });
                renderChat();
            }

            const vocab = localStorage.getItem('vocab');
            const diff = localStorage.getItem('difficulty');
            const vocabArray = vocab.split(',').map(v => v.trim()).filter(v => v);
            const randomWord = vocabArray[Math.floor(Math.random() * vocabArray.length)] || "";

            // Prompt Konstruktion
            const sysPrompt = `Du bist ein spanischer Sprachpartner UND ein strenger Lehrer. WICHTIG: Antworte zwingend im JSON-Format!
ABSOLUTES VERBOT: Nutze für deine spanische Antwort AUSSCHLIESSLICH diese Wörter: [${vocab}]. Keine Ausnahmen!
ANTI-ECHO: Wiederhole niemals den User. Stelle eine völlig NEUE Frage.

Niveau: ${diff}. Beende deine Antwort immer mit einem Fragezeichen (?).
${isStart ? `STARTE DAS GESPRÄCH: Stelle eine spanische Frage und nutze zwingend das Wort '${randomWord}'.` : `Bewerte meinen Satz streng auf Grammatik/Sinn und antworte auf Spanisch.`}

Gib deine Antwort AUSSCHLIESSLICH als gültiges JSON zurück:
{
  "stufe": "Perfekt, Leichter Fehler oder Falsch",
  "feedback": "Kurzes deutsches Feedback",
  "antwort": "Deine spanische Antwort"
}`;

            const messages = [{ role: "system", content: sysPrompt }];
            
            // Kontext laden (max 4 letzte Nachrichten)
            const context = chatHistory.slice(-4).map(msg => ({
                role: msg.role,
                content: msg.role === 'user' ? msg.content : msg.content // Wenn KI, dann nur der pure Text
            }));
            messages.push(...context);

            if (isStart) {
                messages.push({ role: "user", content: "Start" });
            }

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${key}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messages,
                        temperature: 0.3,
                        max_tokens: 250,
                        response_format: { type: "json_object" }
                    })
                });

                if (!response.ok) throw new Error("API Fehler");

                const data = await response.json();
                const result = JSON.parse(data.choices[0].message.content);

                const aiReply = result.antwort || "¿Perdón?";
                
                if (!isStart && chatHistory.length > 0) {
                    // Feedback an die letzte User-Nachricht anhängen
                    chatHistory[chatHistory.length - 1].eval = {
                        stufe: result.stufe || "Fehler",
                        feedback: result.feedback || "Kein Feedback."
                    };
                }

                chatHistory.push({ role: "assistant", content: aiReply });
                
                localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
                renderChat();
                speakSpanish(aiReply);

            } catch (error) {
                alert("Verbindungsfehler zur KI. Checke deinen Key!");
            }

            document.getElementById('loader').style.display = 'none';
        }

        // --- RENDER UI ---
        function renderChat() {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";

            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                
                if (msg.role === 'user') {
                    div.className = 'msg-user';
                    div.innerHTML = `<strong>👤 Du:</strong> ${msg.content}`;
                    
                    if (msg.eval) {
                        let evalClass = 'feedback-error';
                        let icon = '❌';
                        if (msg.eval.stufe.includes('Perfekt')) { evalClass = 'feedback-perfect'; icon = '✅'; }
                        else if (msg.eval.stufe.includes('Fehler')) { evalClass = 'feedback-warning'; icon = '⚠️'; }

                        div.innerHTML += `
                            <div class="feedback-box ${evalClass}">
                                <strong>${icon} ${msg.eval.stufe}:</strong> ${msg.eval.feedback}
                            </div>
                        `;
                    }
                } else {
                    div.className = 'msg-ai';
                    div.innerHTML = `<strong>🤖 KI:</strong> ${msg.content}`;
                }
                
                container.appendChild(div);
            });

            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>
</body>
</html>
